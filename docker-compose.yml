version: '3.8'
services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      APP_ENV: development
      MOCK_AUTH_ENABLED: "true"
      DATABASE_URL: sqlite+aiosqlite:////app/data/sql_app.db
    volumes:
      - backend-data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/')"]
      interval: 10s
      timeout: 3s
      retries: 10

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000/api
        NEXT_PUBLIC_MOCK_ROLE: admin
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  backend-data: